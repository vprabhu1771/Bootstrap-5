<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT-Style UI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .chat-container {
      max-width: 600px;
      margin: 50px auto;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      background-color: #f8f9fa;
    }
    .chat-bubble {
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .chat-bubble.user {
      background-color: #007bff;
      color: white;
      text-align: right;
    }
    .chat-bubble.bot {
      background-color: #e9ecef;
      text-align: left;
    }
    .typing-indicator {
      display: inline-block;
    }
    .typing-indicator span {
      background: #aaa;
      border-radius: 50%;
      display: inline-block;
      height: 8px;
      width: 8px;
      margin: 0 2px;
      animation: blink 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }
    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }
    @keyframes blink {
      0%, 80%, 100% {
        opacity: 0;
      }
      40% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div id="chat-content"></div>
    <div class="input-group mt-3">
      <input id="user-input" type="text" class="form-control" placeholder="Type your message...">
      <button id="send-btn" class="btn btn-primary">Send</button>
    </div>
  </div>

  <script>
    const chatContent = document.getElementById('chat-content');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(message, type) {
      const bubble = document.createElement('div');
      bubble.classList.add('chat-bubble', type);
      bubble.innerHTML = message;
      chatContent.appendChild(bubble);
      chatContent.scrollTop = chatContent.scrollHeight;
    }

    function simulateTyping(responseText) {
      const typingIndicator = document.createElement('div');
      typingIndicator.classList.add('chat-bubble', 'bot', 'typing-indicator');
      typingIndicator.innerHTML = `<span></span><span></span><span></span>`;
      chatContent.appendChild(typingIndicator);
      chatContent.scrollTop = chatContent.scrollHeight;

      setTimeout(() => {
        chatContent.removeChild(typingIndicator);
        typeResponse(responseText);
      }, 2000);
    }

    function typeResponse(responseText) {
      let index = 0;
      const bubble = document.createElement('div');
      bubble.classList.add('chat-bubble', 'bot');
      chatContent.appendChild(bubble);

      const interval = setInterval(() => {
        bubble.textContent += responseText[index];
        chatContent.scrollTop = chatContent.scrollHeight;
        index++;
        if (index >= responseText.length) clearInterval(interval);
      }, 50);
    }

    sendBtn.addEventListener('click', () => {
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      userInput.value = '';

      // Simulate bot response
      simulateTyping("This is a simulated response with typing animation.");
    });
  </script>
</body>
</html>
